name: Share feedback
description: What you like, what feels off, or an idea.
title: "[Feedback]: "
labels: ["feedback"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time. This is public, so please leave out anything private.
  - type: textarea
    id: feedback
    attributes:
      label: What's on your mind?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would make it better?
      description: Optional.
    validations:
      required: false
